server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Algo más que el límite de la API para que su mensaje de archivo grande sea el que se vea.
  client_max_body_size 5m;

  location /api/ {
    # "api" es el servicio del docker-compose.yml del backend.
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Las rutas de la aplicación las resuelve React Router.
  location / {
    try_files $uri /index.html;
  }
}
